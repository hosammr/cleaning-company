# ──────────────────────────────────────────────
# WordPress local development environment
# ──────────────────────────────────────────────

services:
  # WordPress + PHP-FPM
  wordpress:
    build:
      context: ./Docker/php
      dockerfile: Dockerfile
    container_name: hds-wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./wp-content:/var/www/html/wp-content:cached
      - ./wp-config-env.php:/var/www/html/wp-config.php:ro
      - wordpress-core:/var/www/html
    environment:
      WP_ENV: ${WP_ENV:-local}
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-hds_local}
      DB_USER: ${DB_USER:-hds}
      DB_PASSWORD: ${DB_PASSWORD:-hds_local_pass}
      DB_PREFIX: ${DB_PREFIX:-hds_}
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${DB_NAME:-hds_local}
      WORDPRESS_DB_USER: ${DB_USER:-hds}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-hds_local_pass}
      WORDPRESS_TABLE_PREFIX: ${DB_PREFIX:-hds_}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_POST_REVISIONS', 10);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    networks:
      - hds-network

  # Nginx reverse proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: hds-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    volumes:
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress-core:/var/www/html:ro
      - ./wp-content:/var/www/html/wp-content:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    networks:
      - hds-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hds.rule=Host(`hds-schoonmaakdiensten.local`)"
      - "traefik.http.routers.hds.entrypoints=web"
      - "traefik.http.services.hds.loadbalancer.server.port=80"

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: hds-mysql
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-hds_local}
      MYSQL_USER: ${DB_USER:-hds}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hds_local_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - hds-network

  # Redis object cache
  redis:
    image: redis:7-alpine
    container_name: hds-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - hds-network

  # phpMyAdmin (development only)
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: hds-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - hds-network

  # Mailpit (SMTP testing — local only)
  mailpit:
    image: axllent/mailpit:latest
    container_name: hds-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB:-8025}:8025"
      - "${MAILPIT_SMTP:-1025}:1025"
    networks:
      - hds-network

  # Traefik reverse proxy (for clean *.local domains)
  traefik:
    image: traefik:3.6.1
    container_name: hds-traefik
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hds-network

volumes:
  wordpress-core:
    name: hds-wordpress-core
  mysql-data:
    name: hds-mysql-data
  redis-data:
    name: hds-redis-data

networks:
  hds-network:
    name: hds-network
    driver: bridge
