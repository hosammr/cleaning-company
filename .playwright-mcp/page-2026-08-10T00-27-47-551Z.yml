    - generic [ref=e24]:
      - paragraph
      - heading [level=2] [ref=e25]:
        - strong [ref=e26]: Over HDS
      - paragraph [ref=e27]: HDS-schoonmaakdiensten is een schoonmaakbedrijf voor bedrijven in West-Brabant en Zeeland. Wij helpen organisaties met een schone, verzorgde en representatieve werkomgeving die past bij hun dagelijkse praktijk.
      - paragraph [ref=e28]: Van reguliere schoonmaak en glasbewassing tot specialistische reiniging en opleveringsschoonmaak. We stemmen onze werkzaamheden af op uw locatie, uw planning en het gebruik van de ruimte.
      - paragraph [ref=e29]: We werken met duidelijke afspraken en vaste communicatielijnen. Zo weet u wat u van ons kunt verwachten en kunnen onze medewerkers hun werkzaamheden zorgvuldig uitvoeren.
      - paragraph [ref=e30]: In deze branche draait alles om deskundigheid, ervaring en vertrouwen, om deze reden werken wij met vaste vakkundig opgeleide medewerkers die enthousiast hun vak verstaan. Onze mensen beheersen alle reinigingstechnieken en mogen dan ook met recht de reinigingsspecialisten van de regio genoemd worden.
      - paragraph [ref=e31]: "HDS is in staat voor iedere klant een optimaal stappenplan te realiseren. Bij het opstarten van een nieuwe opdracht zorgen wij dat de bedrijfsleiding de eerste periode zelf op het project aanwezig is. Zij kennen de fijne kneepjes van het vak en verwerken hun \x9don the job inzicht van uw bedrijf in een op maat gesneden werkplanning voor onze medewerkers, die te herkennen zijn aan de HDS bedrijfskleding."
    - region [ref=e32]:
      - generic [ref=e33]:
        - heading "Onze missie" [level=2] [ref=e35]
        - paragraph [ref=e36]: Wij geloven dat een schone werkomgeving de basis is voor productiviteit, gezondheid en een goede eerste indruk. Daarom levert HDS al meer dan 20 jaar hoogwaardige schoonmaakdiensten aan bedrijven in West-Brabant en Zeeland.
