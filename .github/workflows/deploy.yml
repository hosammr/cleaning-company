name: Deploy HDS

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'

jobs:
  # ── Lint & Static Analysis ──
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2, phpcs

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS on changed PHP files
        run: |
          BEFORE="${{ github.event.before }}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${BEFORE}..${{ github.sha }}"
          fi

          mapfile -t CHANGED_PHP < <(
            git diff --name-only --diff-filter=d "$RANGE" -- '*.php'
          )

          if [[ ${#CHANGED_PHP[@]} -eq 0 ]]; then
            echo "No PHP files changed, skipping PHPCS"
            exit 0
          fi

          echo "Running PHPCS on changed PHP files:"
          printf '  %s\n' "${CHANGED_PHP[@]}"

          vendor/bin/phpcs --standard=phpcs.xml "${CHANGED_PHP[@]}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Stylelint
        run: npm run lint:css


  # ── Pre-deploy Backup ──
  backup:
    name: Pre-deploy Backup
    needs: lint

    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (
        (
          github.event_name == 'push' &&
          github.ref_name == 'main'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.environment == 'production'
        )
      )

    runs-on: ubuntu-24.04

    environment:
      name: production

    steps:
      - name: Create production database backup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            BACKUP_DIR="../backups"
            mkdir -p "${BACKUP_DIR}"

            BACKUP_FILE="${BACKUP_DIR}/pre-deploy-$(date +%Y%m%d-%H%M%S).sql"

            echo "Creating database backup: ${BACKUP_FILE}"

            wp db export "${BACKUP_FILE}"
            echo "Backup completed successfully."


  # ── Deploy ──
  deploy:
    name: Deploy
    needs:
      - lint
      - backup

    if: >-
      always() &&
      vars.DEPLOY_ENABLED == 'true' &&
      needs.lint.result == 'success' &&
      (
        needs.backup.result == 'success' ||
        needs.backup.result == 'skipped'
      )

    runs-on: ubuntu-24.04

    environment:
      name: >-
        ${{ github.event_name == 'workflow_dispatch'
          && inputs.environment
          || (
            github.ref_name == 'main'
            && 'production'
            || 'staging'
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy theme via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "wp-content/themes/hds/"
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}/wp-content/themes/hds/

      - name: Deploy mu-plugins via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "wp-content/mu-plugins/"
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          TARGET: ${{ secrets.DEPLOY_PATH }}/wp-content/mu-plugins/

      - name: Clear WordPress cache and flush rewrites
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            wp cache flush
            wp rewrite flush

            echo "Deploy complete at $(date)"